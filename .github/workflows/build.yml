name: Build executables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # 매주 월요일: 최신 yt-dlp로 다시 빌드 (유튜브 사양 변경 대응)
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ytdown-windows
            binary: dist/ytdown.exe
          - os: macos-latest
            artifact: ytdown-macos
            binary: dist/ytdown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest httpx

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean ytdown.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
